<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio | IT Professional Portfolio</title>
    <meta name="description" content="IT student and web developer portfolio.">

    <!-- Apply saved theme before first paint (no flash) -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('portfolio-theme');
                if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
                if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            } catch (e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="css/site.css">
    <!-- order matters: data -> render -> behavior -->
    <script src="js/data.js" defer></script>
    <script src="js/content.js" defer></script>
    <script src="js/render.js" defer></script>
    <script src="js/site.js" defer></script>
    <script src="js/media.js" defer></script>
</head>
<body data-page="home">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" id="site-header"></header>

    <main id="main">
        <noscript><div class="container section"><p>This site needs JavaScript turned on to show its content.</p></div></noscript>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
